<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLUX Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="chrome">
    <div id="brand">
      <img src="flux.png" class="brand-icon" alt="FLUX" draggable="false">
      <span>FLUX</span>
    </div>
    <div id="tab-bar">
      <div id="tabs-container"></div>
      <button id="btn-new-tab" class="icon-btn" title="Neuer Tab (Ctrl+T)">
        <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-new-ephemeral" class="icon-btn ephemeral-btn" title="Ephemeral Tab (Ctrl+Shift+T)">
        <span style="font-size:12px;line-height:1;display:block;">👻</span>
      </button>
    </div>
    <div id="window-controls">
      <button class="win-btn" id="btn-minimize" title="Minimieren">
        <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="win-btn" id="btn-maximize" title="Maximieren">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="win-btn danger" id="btn-close" title="Schließen">
        <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <nav id="navbar">
    <div class="nav-group">
      <button class="icon-btn nav-btn" id="btn-back" title="Zurück" disabled>
        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="icon-btn nav-btn" id="btn-forward" title="Vorwärts" disabled>
        <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="icon-btn nav-btn" id="btn-reload" title="Neu laden">
        <svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 10 3.07" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M10 1v3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <div id="address-bar">
      <span id="security-icon" class="secure">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5L2.5 4v4c0 3 2.5 5.5 5.5 6 3-0.5 5.5-3 5.5-6V4L8 1.5z" stroke="currentColor" stroke-width="1.2"/>
          <path id="security-check" d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="text" id="url-input" placeholder="URL eingeben oder suchen..." spellcheck="false" autocomplete="off"/>
      <span id="loading-indicator" class="hidden">
        <svg viewBox="0 0 16 16" class="spinning"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="20 15"/></svg>
      </span>
      <span id="trust-badge" class="trust-badge" title="FLUX Trust Level" style="display:none;">
        <span class="trust-badge-dot"></span>
      </span>
    </div>

    <div class="nav-group">
      <button class="icon-btn nav-btn" id="btn-home" title="Startseite">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8L8 2l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 6.5V14h3v-3h2v3h3V6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- Bookmark button: outline = not bookmarked, filled = bookmarked -->
      <button class="icon-btn nav-btn" id="btn-bookmark" title="Lesezeichen (Ctrl+D)">
        <svg id="bookmark-icon" viewBox="0 0 16 16" fill="none"><path d="M4 2h8v12l-4-3-4 3V2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn nav-btn" id="btn-settings" title="Einstellungen">
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.1 3.1l.7.7M12.2 12.2l.7.7M12.2 3.8l-.7.7M3.8 12.2l-.7.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="nav-group">
      <!-- Downloads button with badge -->
      <button class="icon-btn nav-btn" id="btn-downloads" title="Downloads (Ctrl+J)">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="download-badge" class="download-badge hidden">0</span>
      </button>
      <!-- Extensions button -->
      <button class="icon-btn nav-btn" id="btn-extensions" title="Extensions (Ctrl+Shift+E)">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M6 2h4v2.5c0 .3.2.5.5.5H13v9H3V5h2.5c.3 0 .5-.2.5-.5V2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M6 2c0 1.1.9 2 2 2s2-.9 2-2" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <!-- Resource Monitor toggle -->
      <button class="icon-btn nav-btn" id="btn-resource-monitor" title="Resource Monitor (Ctrl+Shift+M)">
        <svg viewBox="0 0 16 16" fill="none">
          <polyline points="1,11 4,7 7,9 10,4 13,6 15,3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="1" y1="14" x2="15" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn nav-btn shield-btn" id="btn-shield" title="FLUX Shield – Zero-Connection Mode">
        <svg id="shield-icon" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5L2.5 4v4c0 3 2.5 5.5 5.5 6 3-.5 5.5-3 5.5-6V4L8 1.5z"
                stroke="currentColor" stroke-width="1.3" fill="currentColor" fill-opacity="0.15"/>
          <path id="shield-check" d="M5.5 8l1.8 1.8 3.2-3.2"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="shield-count" class="shield-count">0</span>
      </button>
    </div>
  </nav>

  <!-- Bookmark Bar (Ctrl+Shift+B) -->
  <div id="bookmark-bar" class="hidden"></div>

  <!-- Update Bar -->
  <div id="flux-update-bar" style="display:none;"></div>

  <!-- Loading bar -->
  <div id="progress-bar">
    <div id="progress-fill"></div>
  </div>

  <!-- Find Bar (Ctrl+F) -->
  <div id="find-bar" class="hidden">
    <input type="text" id="find-input" placeholder="Suchen..." spellcheck="false"/>
    <span id="find-count" class="find-count"></span>
    <button class="find-btn" id="find-prev" title="Vorheriges (Shift+Enter)">&#8593;</button>
    <button class="find-btn" id="find-next" title="Nächstes (Enter)">&#8595;</button>
    <button class="find-btn find-toggle" id="find-case" title="Groß-/Kleinschreibung">Aa</button>
    <button class="find-btn find-toggle" id="find-regex" title="Regulärer Ausdruck">.*</button>
    <button class="find-btn find-close" id="find-close" title="Schließen (Esc)">✕</button>
  </div>

  <!-- Chrome Web Store install banner -->
  <div id="webstore-banner" class="hidden">
    <span class="ws-banner-icon">🧩</span>
    <div class="ws-banner-text">
      <strong id="webstore-banner-name">Extension</strong>
      <span>detected on Chrome Web Store</span>
    </div>
    <button id="webstore-banner-install" class="ws-banner-btn">Install in FLUX</button>
    <button id="webstore-banner-dismiss" class="ws-banner-close">✕</button>
  </div>

  <main id="webview-container"></main>

  <!-- Resource Monitor Sidebar -->
  <div id="resource-sidebar" class="hidden">
    <div id="resource-sidebar-header">
      <span class="res-title">
        <svg viewBox="0 0 16 16" fill="none" style="width:13px;height:13px;margin-right:5px;vertical-align:middle;">
          <polyline points="1,11 4,7 7,9 10,4 13,6 15,3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="1" y1="14" x2="15" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Resource Monitor
      </span>
      <button id="resource-sidebar-close" class="res-close-btn">✕</button>
    </div>
    <div id="resource-sidebar-body"></div>
  </div>

  <!-- Chrome-Style Download Shelf -->
  <div id="download-tray" class="hidden">
    <div id="download-tray-header">
      <span class="dl-shelf-title">Downloads</span>
      <div class="dl-shelf-actions">
        <button id="download-tray-toggle">Show all</button>
        <button class="dl-shelf-close" id="download-shelf-close">✕</button>
      </div>
    </div>
    <div id="download-tray-body"></div>
  </div>

  <!-- Shortcut Overlay (F1) -->
  <div id="shortcut-overlay" class="hidden"></div>

  <div id="status-bar">
    <span id="status-text"></span>
    <span id="status-right">FLUX v1.5</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
